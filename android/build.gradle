buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // 26 is the floor declared by react-native-vision-camera-face-detector
        // (ML Kit) and react-native-fast-tflite; they inherit this value, so
        // leaving it at 24 would compile but break on Android 7.
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
